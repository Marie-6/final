<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost Traveler: Day 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1D2B4A; --navy-2:#2A3C63; --sign:#FFFFFF; --sign-dim:#C5D0E6;
  --line:#7DB83A; --sakura:#F4A9BE; --amber:#FFC93C; --red:#D8433F;
  --board:#24433A; --chalk:#F1F4EC; --wood:#8A6A45;
  --surface:#F3F7F4; --surface-2:#FFFFFF; --ink:#1D2B4A; --muted:#5A6782; --hair:rgba(29,43,74,.14);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --chalkfont:"Klee One","Zen Maru Gothic","Hiragino Mincho ProN","PingFang SC",serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#141C2E; --surface-2:#1C2740; --ink:#E8EDF6; --muted:#9AA7C0; --hair:rgba(232,237,246,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --surface:#141C2E; --surface-2:#1C2740; --ink:#E8EDF6; --muted:#9AA7C0; --hair:rgba(232,237,246,.16);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--font);background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.objective{display:flex;gap:10px;align-items:center;background:var(--navy);color:var(--sign);border-radius:12px;padding:10px 14px 10px 10px;max-width:min(420px,60vw);box-shadow:0 6px 18px rgba(16,24,42,.25);font-weight:700;font-size:15px;line-height:1.35}
.obj-line{flex:none;width:12px;height:12px;border-radius:50%;background:var(--line);box-shadow:0 0 0 3px rgba(125,184,58,.35)}
.hud-right{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:60vw}
.pill{display:flex;align-items:center;gap:8px;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(16,24,42,.18);border:1px solid var(--hair)}
.pill.yen b{font-size:16px}
.bar{width:84px;height:8px;border-radius:999px;background:var(--hair);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--line);transition:width .5s}
#nbCount{background:var(--navy);color:var(--sign);border-radius:999px;padding:1px 8px;font-size:12px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;border:1px solid var(--hair);box-shadow:0 4px 14px rgba(16,24,42,.18)}
.seg button{padding:5px 11px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--sign)}

/* Interaction prompt */
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;background:var(--amber);color:var(--navy);font-weight:900;font-size:16px;padding:12px 20px;border-radius:999px;box-shadow:0 8px 22px rgba(16,24,42,.3);display:flex;gap:10px;align-items:center}
kbd{font-family:inherit;background:var(--navy);color:var(--sign);border-radius:6px;padding:1px 7px;font-size:13px}

/* Dialogue: station-sign panel */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(780px,calc(100% - 20px));max-height:calc(100% - 110px);overflow-y:auto;z-index:6;background:var(--navy);color:var(--sign);border-radius:14px;box-shadow:0 14px 40px rgba(10,16,30,.45);padding:0 22px 18px}
.stripe{height:8px;margin:0 -22px 14px;background:var(--line);border-radius:14px 14px 0 0}
.dlg-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who b{font-size:15px;background:var(--sign);color:var(--navy);padding:3px 10px;border-radius:6px}
.who span{margin-left:8px;color:var(--sign-dim);font-size:13px}
.ghost{color:var(--sign);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.ghost:hover{background:rgba(255,255,255,.08)}
.jp{font-size:clamp(22px,4.2vw,30px);font-weight:900;margin:12px 0 2px;line-height:1.35;letter-spacing:.02em}
.romaji{margin:0;color:var(--sign-dim);font-size:15px}
.trans-row{display:flex;align-items:center;gap:10px;margin-top:6px;min-height:26px}
.trans{margin:0;color:var(--amber);font-size:16px;font-weight:700;transition:filter .3s,opacity .3s}
.veiled{filter:blur(6px);opacity:.5;user-select:none}
.hint-btn{font-size:12px;font-weight:700;color:var(--navy);background:var(--amber);border-radius:999px;padding:4px 10px;flex:none}
.fb{margin-top:12px;background:rgba(255,255,255,.08);border-left:4px solid var(--sakura);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5}
.fb .fb-jp{font-weight:900;font-size:17px}
.fb .fb-ro{color:var(--sign-dim)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--navy-2);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;color:var(--sign);transition:background .15s,transform .15s}
.opt:hover{background:#344a78}
.opt .o-jp{display:block;font-weight:900;font-size:17px}
.opt .o-ro{display:block;color:var(--sign-dim);font-size:13px}
.opt .o-tr{display:block;color:var(--amber);font-size:13px;margin-top:2px}
.opt.good{background:var(--line);color:var(--navy)}
.opt.good .o-ro,.opt.good .o-tr{color:var(--navy)}
.opt.coin{text-align:center;font-size:22px;font-weight:900;border-radius:999px}
.speak{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.mic{display:flex;align-items:center;gap:10px;background:var(--sakura);color:var(--navy);font-weight:900;font-size:16px;padding:12px 20px;border-radius:999px;user-select:none;-webkit-user-select:none;touch-action:none}
.mic-dot{width:12px;height:12px;border-radius:50%;background:var(--red)}
.mic.on{background:var(--sign);box-shadow:0 0 0 6px rgba(244,169,190,.45)}
.mic.on .mic-dot{animation:pulse .8s infinite alternate}
.mic[disabled]{opacity:.45;cursor:not-allowed}
@keyframes pulse{to{transform:scale(1.5)}}
.mic-status{font-size:14px;color:var(--sign-dim);line-height:1.4;flex:1;min-width:180px}
.next{margin-top:14px;margin-left:auto;display:block;background:var(--amber);color:var(--navy);font-weight:900;padding:10px 22px;border-radius:999px}

/* Lesson: blackboard */
#lesson{position:fixed;inset:0;z-index:7;display:grid;place-items:center;padding:16px;background:rgba(16,24,42,.55)}
.board{width:min(760px,100%);max-height:100%;overflow-y:auto;background:var(--board);color:var(--chalk);border:12px solid var(--wood);border-radius:12px;padding:22px 26px;font-family:var(--chalkfont);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px dashed rgba(241,244,236,.3);padding-bottom:10px;margin-bottom:14px}
.board-head b{font-size:clamp(20px,3.6vw,26px);font-weight:600}
.board-head span{font-family:var(--font);font-size:13px;opacity:.75}
.l-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(241,244,236,.12)}
.l-jp{font-size:clamp(22px,4vw,30px);font-weight:600}
.l-jp.big{font-size:clamp(30px,6vw,44px)}
.l-ro{font-family:var(--font);font-size:14px;opacity:.8}
.l-tr{font-family:var(--font);font-size:15px;color:var(--amber);font-weight:700}
.chalk-btn{font-family:var(--font);border:1px solid rgba(241,244,236,.45);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--chalk)}
.l-note{font-family:var(--font);margin-top:14px;font-size:15px;line-height:1.55;background:rgba(0,0,0,.18);border-radius:8px;padding:10px 12px}
.l-note.zh{border-left:4px solid var(--sakura)}
.board-foot{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.board-foot button{font-family:var(--font);font-weight:900;padding:10px 20px;border-radius:999px}
#lBack{border:1px solid rgba(241,244,236,.45);color:var(--chalk)}
#lNext{background:var(--amber);color:var(--navy)}
.practice{text-align:center;padding:10px 0}
.practice .l-jp{display:block;margin:8px 0}
.practice .speak{justify-content:center}
.practice .mic-status{color:var(--chalk);text-align:center;flex-basis:100%}

/* Panels */
.overlay{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;background:rgba(16,24,42,.5)}
.card{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--surface-2);color:var(--ink);border-radius:16px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.title-jp{font-size:clamp(40px,9vw,64px);font-weight:900;line-height:1;margin:0;color:var(--navy);letter-spacing:.04em}
:root[data-theme="dark"] .title-jp{color:var(--sign)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .title-jp{color:var(--sign)}}
.title-en{font-size:18px;font-weight:700;margin:8px 0 0;color:var(--muted)}
.day{display:inline-block;margin-top:14px;background:var(--line);color:var(--navy);font-weight:900;border-radius:6px;padding:2px 10px}
.card p{line-height:1.6}
.small{font-size:14px;color:var(--muted)}
label.field{display:block;font-weight:700;margin:16px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:1px solid var(--hair);background:var(--surface);color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.primary{background:var(--navy);color:var(--sign);font-weight:900;font-size:17px;padding:13px 24px;border-radius:999px}
:root[data-theme="dark"] .primary{background:var(--amber);color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{background:var(--amber);color:var(--navy)}}
.secondary{border:1px solid var(--hair);font-weight:700;padding:12px 20px;border-radius:999px}

#notebook{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:9;background:var(--surface-2);color:var(--ink);box-shadow:-10px 0 40px rgba(0,0,0,.25);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.nb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nb-head h2{margin:0;font-size:22px}
.nb-item{border-bottom:1px solid var(--hair);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.nb-jp{font-size:22px;font-weight:900}
.nb-ro{font-size:13px;color:var(--muted)}
.nb-tr{font-size:15px}
.nb-place{font-size:12px;color:var(--muted);align-self:start;text-align:right}

.stamp{width:150px;height:150px;border-radius:50%;border:5px solid var(--red);color:var(--red);display:grid;place-items:center;text-align:center;margin:6px auto 14px;transform:rotate(-9deg);font-weight:900;line-height:1.15;position:relative}
.stamp::after{content:"";position:absolute;inset:7px;border:2px solid var(--red);border-radius:50%}
.stamp b{font-size:30px;display:block}
.stamp small{font-size:13px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.stat{background:var(--surface);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}

#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 24px))}
.toast{background:var(--surface-2);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:5px solid var(--line);line-height:1.45;animation:tin .25s ease-out}
.toast.warn{border-left-color:var(--sakura)}
.toast.yen{border-left-color:var(--amber)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--surface);font-weight:700;color:var(--muted)}

@media (max-width:640px){
  #hud{flex-direction:column;align-items:stretch}
  .objective{max-width:none;font-size:14px}
  .hud-right{max-width:none;justify-content:flex-start}
  .bar{width:60px}
  #toasts{top:calc(env(safe-area-inset-top,0px) + 130px)}
}
@media (prefers-reduced-motion: reduce){
  .mic.on .mic-dot{animation:none}
  .toast{animation:none}
  .bar i{transition:none}
}
</style>
</head>
<body>
<div id="loading">Loading the city…</div>
<div id="stage"></div>

<header id="hud" hidden>
  <div class="objective" role="status"><span class="obj-line" aria-hidden="true"></span><span id="objText"></span></div>
  <div class="hud-right">
    <div class="pill yen" aria-label="Yen"><span>¥</span><b id="yen">0</b></div>
    <div class="pill"><span id="confLabel"></span><div class="bar" aria-hidden="true"><i id="confBar"></i></div></div>
    <button class="pill" id="nbBtn"><span id="nbLabel"></span><b id="nbCount">0</b></button>
    <div class="seg" role="group" aria-label="Help language"><button data-lang="en">EN</button><button data-lang="zh">中文</button></div>
    <button class="pill" id="voiceBtn" aria-pressed="true" aria-label="Character voices">🔊</button>
  </div>
</header>

<button id="prompt" hidden><span id="promptText"></span><kbd>E</kbd></button>

<section id="dialog" hidden aria-live="polite">
  <div class="stripe"></div>
  <div class="dlg-top">
    <div class="who"><b id="dWho"></b><span id="dWhoSub"></span></div>
    <button class="ghost" id="dListen">🔊 <span id="dListenLabel"></span></button>
  </div>
  <p class="jp" id="dJp" lang="ja"></p>
  <p class="romaji" id="dRo"></p>
  <div class="trans-row"><p class="trans" id="dTr"></p><button class="hint-btn" id="dHint" hidden></button></div>
  <div class="fb" id="dFb" hidden></div>
  <div class="opts" id="dOpts"></div>
  <div class="speak" id="dSpeak">
    <button class="mic" id="dMic"><span class="mic-dot"></span><span id="dMicLabel"></span></button>
    <span class="mic-status" id="dMicStatus"></span>
  </div>
  <button class="next" id="dNext" hidden></button>
</section>

<section id="lesson" hidden>
  <div class="board" role="dialog" aria-modal="true" aria-labelledby="lTitle">
    <div class="board-head"><b id="lTitle"></b><span id="lStep"></span></div>
    <div id="lBody"></div>
    <div class="board-foot"><button id="lBack"></button><button id="lNext"></button></div>
  </div>
</section>

<aside id="notebook" hidden aria-labelledby="nbTitle">
  <div class="nb-head"><h2 id="nbTitle"></h2><button class="secondary" id="nbClose"></button></div>
  <div id="nbList"></div>
</aside>

<section id="intro" class="overlay">
  <div class="card">
    <p class="title-jp" lang="ja">迷子の旅人</p>
    <p class="title-en">Lost Traveler</p>
    <span class="day" lang="ja">1日目</span>
    <p id="iStory"></p>
    <div class="row" style="margin-top:4px">
      <span class="small" id="iLangLabel"></span>
      <div class="seg" role="group" aria-label="Help language"><button data-lang="en">English</button><button data-lang="zh">中文</button></div>
    </div>
    <label class="field" for="iName" id="iNameLabel"></label>
    <input type="text" id="iName" maxlength="12" placeholder="Alex" autocomplete="off">
    <p class="small" id="iControls"></p>
    <p class="small" id="iMic"></p>
    <div class="row"><button class="primary" id="iStart"></button></div>
  </div>
</section>

<section id="reward" class="overlay" hidden>
  <div class="card" style="text-align:center">
    <div class="stamp" aria-hidden="true"><div><small lang="ja">みなと町</small><b lang="ja">カフェ</b><small lang="ja">1日目</small></div></div>
    <p class="title-jp" lang="ja" style="font-size:clamp(32px,7vw,46px)">1日目 クリア！</p>
    <p class="title-en" id="rSub"></p>
    <div class="stats" id="rStats"></div>
    <p class="small" id="rNext"></p>
    <div class="row" style="justify-content:center">
      <button class="primary" id="rKeep"></button>
      <button class="secondary" id="rReplay"></button>
    </div>
  </div>
</section>

<div id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* ---------- Voice out (text to speech) ---------- */
let jaVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => /^ja/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, force){
  if ((!G.voice && !force) || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/[〜~]/g,''));
    u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice; u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Voice in (speech recognition) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Mic = { rec:null, listening:false, blocked:false, binding:null, alts:[], err:null };
function kana(s){ return s.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function norm(s){ return kana(String(s)).replace(/[\s、。！？!?,.・「」]/g,''); }
function micStatus(msg){ if (Mic.binding) Mic.binding.status.textContent = msg; }
function bindMic(btn, status, handler){
  Mic.binding = { btn, status, handler };
  btn.querySelector('span:last-child').textContent = t('mic');
  if (!SR){ btn.disabled = true; status.textContent = t('micUnsupported'); }
  else if (Mic.blocked){ btn.disabled = true; status.textContent = t('micBlocked'); }
  else { btn.disabled = false; status.textContent = t('micReady'); }
  btn.onpointerdown = e => { e.preventDefault(); try{ btn.setPointerCapture(e.pointerId); }catch(_){} micBegin(); };
  btn.onpointerup = btn.onpointercancel = () => micEnd();
  btn.onkeydown = e => { if ((e.key === 'Enter') && !e.repeat){ e.preventDefault(); micBegin(); } };
  btn.onkeyup = e => { if (e.key === 'Enter') micEnd(); };
}
function micBegin(){
  const b = Mic.binding;
  if (!b || Mic.listening) return;
  if (!SR){ micStatus(t('micUnsupported')); return; }
  if (Mic.blocked){ micStatus(t('micBlocked')); return; }
  Mic.alts = []; Mic.err = null;
  let rec;
  try{
    rec = new SR();
    rec.lang = 'ja-JP'; rec.interimResults = true; rec.maxAlternatives = 3; rec.continuous = true;
  }catch(e){ micStatus(t('micUnsupported')); return; }
  rec.onresult = e => {
    const alts = [];
    const joined = [];
    for (let i = 0; i < e.results.length; i++){
      const res = e.results[i];
      for (let j = 0; j < res.length; j++) alts.push(res[j].transcript);
      joined.push(res[0].transcript);
    }
    alts.unshift(joined.join(''));
    Mic.alts = alts;
    micStatus(t('heard') + ' 「' + alts[0] + '」');
  };
  rec.onerror = e => {
    Mic.err = e.error;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture'){
      Mic.blocked = true; if (Mic.binding){ Mic.binding.btn.disabled = true; } micStatus(t('micBlocked'));
    }
  };
  rec.onend = () => {
    Mic.listening = false;
    if (Mic.binding) Mic.binding.btn.classList.remove('on');
    if (Mic.blocked) return;
    const h = Mic.binding && Mic.binding.handler;
    if (Mic.alts.length && Mic.alts[0].trim()){ if (h) h(Mic.alts); }
    else micStatus(t('noSpeech'));
  };
  try{ rec.start(); }catch(e){ micStatus(t('micBlocked')); return; }
  Mic.rec = rec; Mic.listening = true;
  b.btn.classList.add('on'); micStatus(t('listening'));
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function micEnd(){
  if (Mic.listening && Mic.rec){ try{ Mic.rec.stop(); }catch(e){} }
}
function matchOption(alts, opts){
  const sorted = opts.map((o,i) => ({o,i})).filter(x => x.o.keys).sort((a,b) => (b.o.pri||1) - (a.o.pri||1) || a.i - b.i);
  const said = alts.map(norm);
  for (const {o} of sorted){
    for (const k of o.keys){ const nk = norm(k); if (said.some(s => s.includes(nk))) return o; }
  }
  return null;
}

const D = { nodes:null, id:null, onEnd:null, hint:false, busy:false };
function openDialog(nodes, start, onEnd){
  D.nodes = nodes; D.onEnd = onEnd;
  $('#dialog').hidden = false; $('#prompt').hidden = true;
  showNode(start);
}
function showNode(id){
  D.id = id; D.hint = false; D.busy = false;
  const n = D.nodes[id];
  if (n.action && !n._done){ n._done = true; n.action(); }
  if (n.words) n.words.forEach(addWord);
  if (n.falseFriend && lang === 'zh') toast('⚠ ' + t('ffTitle') + '：先生。' + t('ffNote'), 'warn');
  $('#dFb').hidden = true;
  renderNode();
  say(val(n.jp));
}
function renderNode(){
  const n = D.nodes[D.id]; if (!n) return;
  const sp = SPEAKERS[n.who];
  $('#dWho').textContent = sp.jp; $('#dWhoSub').textContent = tr(sp.sub);
  $('#dListenLabel').textContent = t('listen');
  $('#dJp').textContent = val(n.jp);
  const veil = n.faded && !D.hint;
  $('#dRo').textContent = val(n.r);
  $('#dRo').classList.toggle('veiled', !!(n.hideAll && !D.hint));
  $('#dTr').textContent = lang === 'zh' ? val(n.zh) : val(n.en);
  $('#dTr').classList.toggle('veiled', veil);
  $('#dHint').hidden = !veil; $('#dHint').textContent = t('hint');
  const opts = $('#dOpts'); opts.textContent = '';
  if (n.options){
    n.options.forEach(o => {
      const b = document.createElement('button');
      if (n.pay){
        b.className = 'opt coin'; b.textContent = o.label;
      } else {
        b.className = 'opt';
        const j = document.createElement('span'); j.className='o-jp'; j.lang='ja'; j.textContent = val(o.jp);
        const r = document.createElement('span'); r.className='o-ro'; r.textContent = val(o.r);
        b.append(j, r);
        if (!veil){ const m = document.createElement('span'); m.className='o-tr'; m.textContent = lang === 'zh' ? val(o.zh) : val(o.en); b.append(m); }
      }
      b.onclick = () => choose(o, false, b);
      o._btn = b;
      opts.appendChild(b);
    });
  }
  const speakable = n.options && !n.pay;
  $('#dSpeak').hidden = !speakable;
  if (speakable) bindMic($('#dMic'), $('#dMicStatus'), alts => {
    const o = matchOption(alts, n.options);
    if (o) choose(o, true, o._btn);
    else micStatus(t('heard') + ' 「' + alts[0] + '」 ' + t('noMatch'));
  });
  else Mic.binding = null;
  if (n.pay && $('#dFb').hidden){ $('#dFb').hidden = false; $('#dFb').textContent = t('payPrompt'); }
  const nx = $('#dNext');
  nx.hidden = !!n.options; nx.textContent = t('next');
}

function choose(o, spoken, btn){
  if (D.busy) return;
  const n = D.nodes[D.id];
  if (!o.ok){ showFeedback(o.wrong); return; }
  D.busy = true;
  if (btn) btn.classList.add('good');
  addConf(8 + (spoken ? 6 : 0) + (n.faded && !D.hint ? 4 : 0));
  if (spoken){ G.spoken++; addYen(20, true); toast(t('spokenBonus'), 'yen'); }
  if (o.set) o.set();
  setTimeout(() => {
    if (o.next) showNode(o.next);
    else endDialog(o.end || n.end);
  }, 450);
}
function endDialog(key){
  $('#dialog').hidden = true; Mic.binding = null;
  const cb = D.onEnd; D.nodes = null;
  if (cb) cb(key);
}
$('#dNext').onclick = () => {
  const n = D.nodes && D.nodes[D.id]; if (!n) return;
  if (n.next) showNode(n.next); else endDialog(n.end);
};

const matCache = {};
function mat(c){ return matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color:c })); }
function box(w, h, d, m, x, y, z, parent){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof m === 'number' ? mat(m) : m);
  mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true;
  (parent || scene).add(mesh); return mesh;
}
function cyl(rt, rb, h, c, x, y, z, parent, seg){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 12), mat(c));
  mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true;
  (parent || scene).add(mesh); return mesh;
}
function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const FONT = '"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","PingFang SC",sans-serif';
function textPlane(w, h, lines, bg, opts){
  opts = opts || {};
  const W = 1024, H = Math.max(64, Math.round(W * h / w));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  if (bg){ g.fillStyle = bg; rr(g, 0, 0, W, H, opts.radius || 0); g.fill(); }
  if (opts.stripe){ g.fillStyle = opts.stripe; g.fillRect(0, H - H*0.12, W, H*0.12); }
  const total = lines.reduce((a, l) => a + l.size * H, 0) * 1.15;
  let y = (H - total) / 2;
  g.textAlign = 'center'; g.textBaseline = 'top';
  lines.forEach(l => {
    g.font = (l.weight || 900) + ' ' + Math.round(l.size * H) + 'px ' + (l.font || FONT);
    g.fillStyle = l.color || '#fff';
    g.fillText(l.text, W / 2, y + l.size * H * 0.06);
    y += l.size * H * 1.15;
  });
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map:tex, transparent:true }));
  return m;
}
function windowTex(base, win){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 64, 64);
  g.fillStyle = win; g.fillRect(9, 12, 19, 24); g.fillRect(36, 12, 19, 24);
  g.fillStyle = 'rgba(0,0,0,.10)'; g.fillRect(0, 56, 64, 8);
  const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; return tx;
}

  const g = new THREE.Group(); scene.add(g);
  if (b.school){
    box(b.w, b.h, depth, 0xF2EEE4, b.x, b.h/2, zc, g);
    const roof = box(b.w + 0.6, 0.35, depth + 0.6, 0x3E5A86, b.x, b.h + 0.18, zc, g);
    for (let i = -1; i <= 1; i += 2) for (let r = 0; r < 2; r++) box(1.6, 1.0, 0.06, new THREE.MeshLambertMaterial({ color:0x9CC3DA }), b.x + i * 3, 2.2 + r * 2.1, faceZ, g);

    box(b.w, b.h, depth, 0xF4E4CF, b.x, b.h/2, zc, g);
    box(b.w + 0.4, 0.3, depth + 0.4, 0x6B4A2F, b.x, b.h + 0.15, zc, g);
    box(3.6, 2.1, 0.06, 0x3B2B22, b.x, 1.75, faceZ, g);
    // striped awning
    const c = document.createElement('canvas'); c.width = 256; c.height = 32; const cg = c.getContext('2d');
    for (let i = 0; i < 8; i++){ cg.fillStyle = i % 2 ? '#F6F1E7' : '#3F7D5A'; cg.fillRect(i*32, 0, 32, 32); }
    const aw = new THREE.Mesh(new THREE.BoxGeometry(b.w, 0.12, 1.7), new THREE.MeshLambertMaterial({ map:new THREE.CanvasTexture(c) }));
    aw.position.set(b.x, 3.25, front - 0.8); aw.rotation.x = -0.22; aw.castShadow = true; g.add(aw);

    sign.position.set(b.x, 4.0, faceZ - 0.03); sign.rotation.y = rotY; g.add(sign);

    solid(b.x + 2.35, b.x + 3.45, front - 1.0, front - 0.4);

  }
  const top = mat(0x8E949C);

  const wallMat = new THREE.MeshLambertMaterial({ map:tex });
  const m = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, depth), [wallMat, wallMat, top, top, wallMat, wallMat]);
  m.position.set(b.x, b.h/2, zc); m.castShadow = m.receiveShadow = true; g.add(m);
  solid(b.x - b.w/2, b.x + b.w/2, side < 0 ? -14 : front, side < 0 ? front : 14);
  // rooftop clutter
  for (let i = 0; i < 2; i++) box(0.9 + rand(), 0.6, 0.9, 0x9AA0A6, b.x + (rand()-0.5) * (b.w - 2), b.h + 0.3, zc + (rand()-0.5) * 3, g);
  if (b.station){
    box(4.2, 2.6, 0.1, 0x22252B, b.x, 1.4, faceZ, g);
    const s = textPlane(5.6, 1.4, [{ text:'みなと駅', size:0.5, color:'#1D2B4A' }, { text:'Minato Station', size:0.2, color:'#5A6782', weight:700 }], '#FFFFFF', { radius:18, stripe:'#7DB83A' });
    s.position.set(b.x, 3.6, faceZ + 0.03); g.add(s);
  }
  if (b.konbini){
    const band = textPlane(b.w, 0.9, [{ text:'コンビニ', size:0.6, color:'#FFFFFF' }], '#2F8F6B', { stripe:'#2B5DA8' });
    band.position.set(b.x, 3.2, faceZ - 0.03); band.rotation.y = rotY; g.add(band);
    box(4.5, 2.4, 0.06, new THREE.MeshLambertMaterial({ color:0xDDEFF5 }), b.x, 1.3, faceZ, g);
  }
}

/* ---------- Characters ---------- */
function character(o){
  const g = new THREE.Group();
  const legGeo = new THREE.BoxGeometry(0.2, 0.62, 0.22); legGeo.translate(0, -0.31, 0);
  const armGeo = new THREE.BoxGeometry(0.13, 0.58, 0.15); armGeo.translate(0, -0.27, 0);
  const lL = new THREE.Mesh(legGeo, mat(o.legs)); lL.position.set(-0.13, 0.64, 0);
  const lR = new THREE.Mesh(legGeo, mat(o.legs)); lR.position.set(0.13, 0.64, 0);
  const body = new THREE.Group(); body.position.y = 0;
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.37, 0.78, 14), mat(o.body)); torso.position.y = 1.02;
  const aL = new THREE.Mesh(armGeo, mat(o.body)); aL.position.set(-0.4, 1.33, 0);
  const aR = new THREE.Mesh(armGeo, mat(o.body)); aR.position.set(0.4, 1.33, 0);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), mat(0xF2C9A5)); head.position.y = 1.66;
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12, 0, Math.PI*2, 0, Math.PI*0.55), mat(o.hair)); hair.position.set(0, 1.69, -0.02);
  const eyeMat = mat(0x1E1E24);
  [-0.09, 0.09].forEach(x => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), eyeMat); e.position.set(x, 1.68, 0.255); body.add(e); });
  body.add(torso, aL, aR, head, hair);
  if (o.longHair){ const lh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.14), mat(o.hair)); lh.position.set(0, 1.45, -0.22); body.add(lh); }
  if (o.backpack){ const bp = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.55, 0.22), mat(0xE8A33D)); bp.position.set(0, 1.08, -0.38); body.add(bp); }
  if (o.apron){ const ap = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.06), mat(0x6B4A2F)); ap.position.set(0, 0.98, 0.33); body.add(ap); }
  if (o.cap){ const cp = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.31, 0.16, 16), mat(0x3F7D5A)); cp.position.set(0, 1.86, 0); body.add(cp); }
  if (o.glasses){ const gl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.05, 0.02), eyeMat); gl.position.set(0, 1.69, 0.27); body.add(gl); }
  g.add(lL, lR, body);
  g.traverse(m => { if (m.isMesh){ m.castShadow = true; } });
  g.userData = { lL, lR, aL, aR, body, phase:0 };
  return g;
}
function nameTag(jp, sub){
  const c = document.createElement('canvas'); c.width = 512; c.height = 170;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(29,43,74,.9)'; rr(g, 6, 6, 500, 158, 40); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.font = '900 66px ' + FONT; g.fillText(jp, 256, 66);
  g.fillStyle = '#C5D0E6'; g.font = '700 34px ' + FONT; g.fillText(sub, 256, 130);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), depthTest:false }));
  s.scale.set(1.7, 0.56, 1); s.renderOrder = 10; return s;
}
function animateWalk(ch, moving, dt){
  const u = ch.userData;
  if (moving){ u.phase += dt * 10; } else { u.phase *= 0.85; }
  const s = Math.sin(u.phase) * (moving ? 0.65 : 0.65 * Math.min(1, Math.abs(Math.sin(u.phase))));
  u.lL.rotation.x = s; u.lR.rotation.x = -s; u.aL.rotation.x = -s * 0.8; u.aR.rotation.x = s * 0.8;
  u.body.position.y = moving ? Math.abs(Math.sin(u.phase)) * 0.05 : 0;
}
function turnTo(obj, ang, dt){
  let d = ang - obj.rotation.y; while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2;
  obj.rotation.y += d * Math.min(1, dt * 10);
}

const W = {};
let player, tanaka, barista, marker, ring, clickRing, cup;

function buildPeople(){
  player = character({ body:0x3F6FB5, legs:0x2B2F3A, hair:0x3A2A20, backpack:true });
  player.position.set(-14, 0.18, -4.4); player.rotation.y = 0; scene.add(player);
  tanaka = character({ body:0x6F9A5C, legs:0x4B4F6B, hair:0x1F1A17, longHair:true, glasses:true });
  tanaka.position.set(-10.6, 0.18, -4.7); tanaka.rotation.y = -Math.PI/2; scene.add(tanaka);
  const tTag = nameTag('田中先生', 'Tanaka-sensei'); tTag.position.y = 2.45; tanaka.add(tTag); W.tTag = tTag;
  barista = character({ body:0xF2EFE8, legs:0x2B2F3A, hair:0x2C2C2C, apron:true, cap:true });
  barista.position.set(14, 0.18, 6.25); barista.rotation.y = Math.PI; scene.add(barista);
  const bTag = nameTag('店員さん', 'Café staff'); bTag.position.y = 2.5; barista.add(bTag); W.bTag = bTag;

  marker = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.55, 4), new THREE.MeshBasicMaterial({ color:0xFFC93C }));
  marker.rotation.x = Math.PI; scene.add(marker);
  ring = new THREE.Mesh(new THREE.RingGeometry(0.7, 0.85, 40), new THREE.MeshBasicMaterial({ color:0xFFC93C, transparent:true, opacity:0.85, side:THREE.DoubleSide }));
  ring.rotation.x = -Math.PI/2; scene.add(ring);
  clickRing = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.36, 28), new THREE.MeshBasicMaterial({ color:0xFFFFFF, transparent:true, opacity:0.9, side:THREE.DoubleSide }));
  clickRing.rotation.x = -Math.PI/2; clickRing.visible = false; scene.add(clickRing);
}
function giveCup(){
  if (cup) return;
  cup = new THREE.Group();
  const c1 = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.08, 0.26, 12), mat(0xFFFFFF));
  const c2 = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.1, 0.1, 12), mat(0x8A5E3B));
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.04, 12), mat(G.drink === 'ocha' ? 0x5E9E4A : G.drink === 'jusu' ? 0xF2A33A : 0x3B2B22));
  lid.position.y = 0.15; cup.add(c1, c2, lid);
  cup.position.set(0, -0.62, 0.12);
  player.userData.aR.add(cup);
}

/* ---------- Interaction ---------- */
const doorPos = new THREE.Vector3(0, 0, -5.6);
const cafeSpot = new THREE.Vector3(14, 0, 4.7);
const tanakaSchoolSpot = new THREE.Vector3(-1.9, 0.18, -5.5);
function candidates(){
  const list = [];
  const p = G.phase;
  if (p === 'findTanaka') list.push({ key:'tanaka', pos:tanaka.position, r:2.4, label:t('talkTanaka'), act:() => openDialog(TANAKA, 't1', onTanakaEnd) });
  if (p === 'goSchool') list.push({ key:'door', pos:doorPos, r:2.3, label:t('enterSchool'), act:openLesson });
  if (p === 'goCafe') list.push({ key:'barista', pos:cafeSpot, r:2.2, label:t('talkBarista'), act:() => openDialog(CAFE, 'c1', onCafeEnd) });
  if (p === 'done'){
    list.push({ key:'tanaka', pos:tanaka.position, r:2.4, label:t('chatTanaka'), act:() => { toast(t('doneTanaka')); say('おつかれさま'); } });
    list.push({ key:'barista', pos:cafeSpot, r:2.2, label:t('chatBarista'), act:() => { toast(t('doneBarista')); say('またどうぞ'); } });
  }
  list.push({ key:'vending', pos:new THREE.Vector3(9.6, 0, -5.2), r:1.7, label:t('lookVending'), act:() => { toast(t('vendingNote')); say('自動販売機'); } });
  return list;
}
function onTanakaEnd(key){ if (key === 'goSchool'){ setPhase('goSchool'); W.tanakaWalking = true; } }
function onCafeEnd(key){ if (key === 'cafeDone'){ addYen(100, true); addConf(10); setPhase('done'); setTimeout(showReward, 600); } }
function uiOpen(){ return !$('#dialog').hidden || !$('#lesson').hidden || !$('#intro').hidden || !$('#reward').hidden || !$('#notebook').hidden; }

let nearest = null, lastPrompt = null, pendingKey = null;
$('#prompt').onclick = () => { if (nearest && !uiOpen()) nearest.act(); };

/* ---------- Input ---------- */
const keys = {};
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' && Mic.binding && !Mic.binding.btn.disabled){ e.preventDefault(); if (!e.repeat) micBegin(); return; }
  if ((e.key === 'e' || e.key === 'E') && nearest && !uiOpen()){ nearest.act(); return; }
  if (e.key === 'Escape' && !$('#notebook').hidden){ $('#notebook').hidden = true; return; }
  keys[e.code] = true;
  if (/^(Arrow|Key[WASD])/.test(e.code)){ moveTarget = null; pendingKey = null; clickRing.visible = false; }
});
addEventListener('keyup', e => {
  if (e.code === 'Space' && Mic.binding){ e.preventDefault(); micEnd(); return; }
  keys[e.code] = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -0.18);
let moveTarget = null, downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x:e.clientX, y:e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || uiOpen()) return;
  if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 10) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const targets = [[tanaka,'tanaka'],[barista,'barista'],[W.vending,'vending'],[W.door,'door']];
  const hits = ray.intersectObjects(targets.map(x => x[0]), true);
  if (hits.length){
    let o = hits[0].object, key = null;
    while (o && !key){ const f = targets.find(x => x[0] === o); if (f) key = f[1]; o = o.parent; }
    const c = candidates().find(x => x.key === key);
    if (c){
      const to = c.pos.clone(); const dir = new THREE.Vector3().subVectors(player.position, to); dir.y = 0;
      if (dir.length() > 1.2) dir.setLength(1.2);
      moveTarget = new THREE.Vector3(to.x + dir.x, 0, to.z + dir.z);
      pendingKey = key; clickRing.visible = false; return;
    }
  }
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(groundPlane, p)){
    p.x = Math.max(-27, Math.min(27, p.x)); p.z = Math.max(-6.2, Math.min(6.2, p.z));
    moveTarget = p; pendingKey = null;
    clickRing.position.set(p.x, 0.22, p.z); clickRing.visible = true;
  }
});

/* ---------- Physics-lite ---------- */
function collide(pos, rad){
  for (const o of obstacles){
    if (o.r !== undefined){
      const dx = pos.x - o.cx, dz = pos.z - o.cz, d = Math.hypot(dx, dz), m = o.r + rad;
      if (d < m && d > 0.0001){ pos.x = o.cx + dx / d * m; pos.z = o.cz + dz / d * m; }
    } else {
      const cx = Math.max(o.x1, Math.min(pos.x, o.x2)), cz = Math.max(o.z1, Math.min(pos.z, o.z2));
      const dx = pos.x - cx, dz = pos.z - cz, d = Math.hypot(dx, dz);
      if (d < rad){
        if (d > 0.0001){ pos.x = cx + dx / d * rad; pos.z = cz + dz / d * rad; }
        else {
          const pens = [pos.x - o.x1, o.x2 - pos.x, pos.z - o.z1, o.z2 - pos.z]; const i = pens.indexOf(Math.min(...pens));
          if (i === 0) pos.x = o.x1 - rad; else if (i === 1) pos.x = o.x2 + rad; else if (i === 2) pos.z = o.z1 - rad; else pos.z = o.z2 + rad;
        }
      }
    }
  }
  pos.x = Math.max(-27, Math.min(27, pos.x)); pos.z = Math.max(-6.3, Math.min(6.3, pos.z));
}

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3(), camLook = new THREE.Vector3();
let time = 0, started = false;
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function frame(){
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  let moving = false;
  if (started && !uiOpen()){
    let vx = 0, vz = 0;
    if (keys.KeyW || keys.ArrowUp) vz -= 1; if (keys.KeyS || keys.ArrowDown) vz += 1;
    if (keys.KeyA || keys.ArrowLeft) vx -= 1; if (keys.KeyD || keys.ArrowRight) vx += 1;
    if (!vx && !vz && moveTarget){
      const dx = moveTarget.x - player.position.x, dz = moveTarget.z - player.position.z, d = Math.hypot(dx, dz);
      if (d < 0.15){ moveTarget = null; clickRing.visible = false; } else { vx = dx / d; vz = dz / d; }
    }
    const len = Math.hypot(vx, vz);
    if (len){
      vx /= len; vz /= len; const sp = 4.4 * dt;
      const before = player.position.clone();
      player.position.x += vx * sp; player.position.z += vz * sp;
      collide(player.position, 0.38);
      if (moveTarget && player.position.distanceTo(before) < sp * 0.15){ moveTarget = null; clickRing.visible = false; }
      turnTo(player, Math.atan2(vx, vz), dt); moving = true;
    }
  }
  animateWalk(player, moving, dt);

  // Tanaka
  let tMoving = false;
  if (W.tanakaWalking){
    const dx = tanakaSchoolSpot.x - tanaka.position.x, dz = tanakaSchoolSpot.z - tanaka.position.z, d = Math.hypot(dx, dz);
    if (d > 0.08){ const sp = Math.min(d, 3.2 * dt); tanaka.position.x += dx / d * sp; tanaka.position.z += dz / d * sp; turnTo(tanaka, Math.atan2(dx, dz), dt); tMoving = true; }
    else W.tanakaWalking = false;
  } else {
    const dx = player.position.x - tanaka.position.x, dz = player.position.z - tanaka.position.z;
    if (Math.hypot(dx, dz) < 5) turnTo(tanaka, Math.atan2(dx, dz), dt);
  }
  animateWalk(tanaka, tMoving, dt);
  if (G.phase === 'findTanaka' && !tMoving){ tanaka.userData.aR.rotation.z = 2.4 + Math.sin(time * 6) * 0.35; tanaka.userData.aR.rotation.x = 0; }
  else tanaka.userData.aR.rotation.z *= 0.85;
  { const dx = player.position.x - barista.position.x, dz = player.position.z - barista.position.z;
    if (Math.hypot(dx, dz) < 5) turnTo(barista, Math.atan2(dx, dz), dt); else turnTo(barista, Math.PI, dt); }

  // objective marker
  let tgt = null;
  if (G.phase === 'findTanaka') tgt = tanaka.position;
  else if (G.phase === 'goSchool') tgt = doorPos;
  else if (G.phase === 'goCafe') tgt = cafeSpot;
  marker.visible = ring.visible = !!tgt && started;
  if (tgt){
    const tall = G.phase === 'findTanaka' ? 3.1 : 2.6;
    marker.position.set(tgt.x, tall + (RM ? 0 : Math.sin(time * 3) * 0.15), tgt.z);
    marker.rotation.y += dt * 1.5;
    ring.position.set(tgt.x, 0.22, tgt.z);
    const s = RM ? 1 : 1 + Math.sin(time * 3) * 0.08; ring.scale.set(s, s, s);
  }
  if (clickRing.visible){ clickRing.rotation.z += dt; }

  // petals
  if (W.petals){
    const a = W.petals.geometry.attributes.position;
    for (let i = 0; i < a.count; i++){
      let y = a.getY(i) - dt * 0.5; let x = a.getX(i) + Math.sin(time + i) * dt * 0.3;
      if (y < 0.2){ y = 3.6 + rand(); x = 5.6 + (rand()-0.5) * 3; }
      a.setY(i, y); a.setX(i, x);
    }
    a.needsUpdate = true;
  }

  // interaction prompt
  nearest = null;
  if (started && !uiOpen()){
    let best = Infinity;
    for (const c of candidates()){
      const d = Math.hypot(c.pos.x - player.position.x, c.pos.z - player.position.z);
      if (d < c.r && d < best){ best = d; nearest = c; }
    }
    if (pendingKey && nearest && nearest.key === pendingKey){ pendingKey = null; moveTarget = null; const n = nearest; nearest = null; n.act(); }
  }
  const label = nearest ? nearest.label : null;
  if (label !== lastPrompt){
    lastPrompt = label;
    $('#prompt').hidden = !label;
    if (label) $('#promptText').textContent = label;
  }
  if (uiOpen() && !$('#prompt').hidden){ $('#prompt').hidden = true; lastPrompt = null; }

  // camera
  const portrait = camera.aspect < 0.85;
  const off = portrait ? new THREE.Vector3(0, 12.5, 14.5) : new THREE.Vector3(0, 8.4, 10.6);
  camTarget.copy(player.position).add(off);
  const k = 1 - Math.pow(0.002, dt);
  camera.position.lerp(camTarget, k);
  camLook.lerp(new THREE.Vector3(player.position.x, 1.0, player.position.z - (portrait ? 0.5 : 0)), k);
  camera.lookAt(camLook);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
async function boot(){
  try{
    await Promise.race([
      Promise.all([
        document.fonts.load('900 64px "Zen Maru Gothic"', '日本語学校カフェみなと駅コンビニメニュー田中先生店員さん'),
        document.fonts.load('700 64px "Zen Maru Gothic"', 'コーヒーお茶ジュースホットアイスMinato Station'),
        document.fonts.load('600 32px "Klee One"', 'をください')
      ]),
      new Promise(r => setTimeout(r, 2500))
    ]);
  }catch(e){}
  buildWorld(); buildPeople(); resize();
  camLook.set(player.position.x, 1, player.position.z);
  camera.position.copy(player.position).add(new THREE.Vector3(0, 8.4, 10.6));
  $('#loading').remove();
  applyLang();
  requestAnimationFrame(frame);
}
$('#iStart').onclick = () => {
  const n = $('#iName').value.replace(/[^A-Za-z\- ]/g, '').trim();
  G.name = n ? n[0].toUpperCase() + n.slice(1) : 'Alex';
  $('#intro').hidden = true; $('#hud').hidden = false;
  started = true; setPhase('findTanaka');
  if ('speechSynthesis' in window){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} }
};
$('#iName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#iStart').click(); });
boot();
})();
