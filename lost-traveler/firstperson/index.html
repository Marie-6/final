<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost Traveler: Street Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1D2B4A; --sign:#FFFFFF; --sign-dim:#C5D0E6; --line:#7DB83A; --sakura:#F4A9BE; --amber:#FFC93C;
  --surface:#F3F7F4; --ink:#1D2B4A; --muted:#5A6782; --hair:rgba(29,43,74,.14);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1D2B4A;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{display:block;touch-action:none;cursor:pointer}
button{font:inherit;cursor:pointer;border:0}
.hud{position:fixed;z-index:3;display:flex;gap:10px;align-items:center}
.top-left{top:14px;left:16px}
.top-right{top:14px;right:16px}
.badge{background:var(--navy);color:var(--sign);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(16,24,42,.25)}
.badge small{display:block;font-weight:500;color:var(--sign-dim);font-size:12px}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 4px 14px rgba(16,24,42,.25)}
.seg button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);background:none}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--sign)}
.help{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:3;background:rgba(29,43,74,.82);color:var(--sign);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
kbd{font-family:inherit;background:var(--sign);color:var(--navy);border-radius:5px;padding:0 6px;font-size:12px}
#card{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));background:var(--navy);color:var(--sign);border-radius:14px;box-shadow:0 14px 40px rgba(10,16,30,.5);overflow:hidden;display:none}
#card .stripe{height:8px;background:var(--line)}
#card .body{padding:16px 20px 18px}
#card ruby{font-size:34px;font-weight:900;line-height:1.5}
#card rt{font-size:13px;color:var(--sign-dim);font-weight:700}
#card .ro{color:var(--sign-dim);margin:2px 0 0;font-size:15px}
#card .tr{color:var(--amber);font-weight:700;font-size:17px;margin:8px 0 0}
#card .row{display:flex;gap:8px;margin-top:14px}
#card .row button{border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.save{background:var(--amber);color:var(--navy)}
.close{background:none;color:var(--sign);border:1px solid rgba(255,255,255,.35)!important}
#saved{font-size:12px;color:var(--sign-dim);margin-top:2px}
.move{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:3;display:none;flex-direction:column;gap:8px}
.move button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--navy);font-size:22px;font-weight:900;box-shadow:0 4px 14px rgba(16,24,42,.3)}
@media (pointer:coarse){.move{display:flex}.help .keys{display:none}}
#vend{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--navy);color:var(--sign);border-radius:16px;box-shadow:0 14px 40px rgba(10,16,30,.5);display:none;padding:14px 16px 16px}
#vend .vh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#vend .vh ruby{font-size:26px;font-weight:900;line-height:1.5}
#vend .vh rt{font-size:11px;color:var(--sign-dim)}
#vend .sub{color:var(--sign-dim);font-size:13px;margin:0}
#vend .vx{background:var(--sign);color:var(--navy);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;flex:none}
#vend .vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-top:12px}
#vend .it{background:linear-gradient(#FFFFFF,#E9EFF5);color:var(--ink);border-radius:12px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
#vend .it:hover,#vend .it:focus-visible{outline:3px solid var(--amber)}
#vend .it img{height:100px;width:auto}
#vend .it ruby{font-size:15px;font-weight:900;line-height:1.6}
#vend .it rt{font-size:9px;color:var(--muted)}
#vend .it .en{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
#vend .it .pr{white-space:nowrap;display:flex;gap:4px;align-items:center;font-size:13px;font-weight:900}
#vend .tag{white-space:nowrap;font-size:10px;font-weight:700;color:#fff;border-radius:5px;padding:1px 5px}
#vend .cold{background:#2F6FB8} #vend .hot{background:#D8433F}
#vend .num{position:absolute;top:5px;left:8px;font-size:11px;font-weight:700;color:var(--muted)}
#toast{position:fixed;z-index:4;left:50%;top:22%;transform:translateX(-50%);background:var(--navy);color:var(--sign);border-radius:999px;padding:8px 18px;font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(16,24,42,.3);display:none;white-space:nowrap}
#toast rt{font-size:10px;color:var(--sign-dim)}
#seat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:3;display:none;background:var(--amber);color:var(--navy);border:0;border-radius:999px;padding:8px 18px;font:700 16px var(--font);box-shadow:0 6px 18px rgba(16,24,42,.3);cursor:pointer}
#seat rt{font-size:10px}
#seat kbd{background:var(--navy);color:var(--sign);margin-right:6px}
@media (pointer:coarse){#seat kbd{display:none}}
#dot{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(29,43,74,.6);z-index:3;display:none;pointer-events:none}
body.locked #dot{display:block}
body.locked canvas{cursor:none}
.help .lockedtip,.help .touch{display:none}
body.locked .help .lockedtip{display:inline}
body.locked .help .free{display:none}
@media (pointer:coarse){.help .touch{display:inline}}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--sign);font-weight:700;z-index:5;background:var(--navy)}
body.shot .hud,body.shot .help,body.shot .move{display:none}
@media (max-width:520px){.badge small{display:none}.seg button{padding:5px 9px}}
</style>
</head>
<body>
<div id="loading">読み込み中… Building the street</div>

<div class="hud top-left"><div class="badge">日本語学校の通り<small>First-person street test</small></div></div>
<div class="hud top-right">
  <div class="seg" id="lang"><button data-l="en" aria-pressed="true">EN</button><button data-l="zh" aria-pressed="false">中文</button></div>
  <div class="seg" id="tod"><button data-t="asa">朝</button><button data-t="hiru">昼</button><button data-t="yoru">夜</button></div>
</div>
<div class="help"><span class="keys"><span class="free">Click to look around · </span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run · <span class="lockedtip">click a sign to read it · <kbd>Esc</kbd> frees the mouse</span></span><span class="touch">drag to look · tap a sign to read it</span></div>
<div id="dot" aria-hidden="true"></div>
<button id="seat" type="button"></button>
<div id="toast" aria-live="polite"></div>
<div id="vend" role="dialog" aria-label="Vending machine">
  <div class="vh"><div><div id="vendJp"></div><p class="sub" id="vendSub"></p></div><button class="vx" id="vendClose">やめる ✕</button></div>
  <div class="vg" id="vendGrid"></div>
</div>
<div class="move"><button id="fwd" aria-label="Walk forward">▲</button><button id="back" aria-label="Walk back">▼</button></div>

<div id="card" role="dialog" aria-label="Sign">
  <div class="stripe"></div>
  <div class="body">
    <div id="cardJp"></div>
    <p class="ro" id="cardRo"></p>
    <p class="tr" id="cardTr"></p>
    <div class="row"><button class="save" id="saveBtn">手帳に保存 Save</button><button class="close" id="closeBtn">OK</button></div>
    <div id="saved"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const params = new URLSearchParams(location.search);
const SHOT = params.get('ui') === '0';
if (SHOT) document.body.classList.add('shot');

// ================================================================ setup
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 700);
camera.rotation.order = 'YXZ';

let seed = 20261120;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rand() * a.length)];
const range = (a, b) => a + rand() * (b - a);
const shade = (hex, f) => { const c = new THREE.Color(hex); c.multiplyScalar(f); return '#' + c.getHexString(); };

// ---------------------------------------------------------------- materials
const matCache = new Map();
function std(color, extra) {
  const simple = !extra || Object.values(extra).every(v => v === null || typeof v !== 'object');
  const key = color + (extra ? JSON.stringify(extra) : '');
  if (simple && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial({ color, roughness: .88, metalness: 0, ...extra });
  if (simple) matCache.set(key, m);
  return m;
}
const metal = c => std(c, { roughness: .45, metalness: .35 });
// things that glow more at night
const glows = [];
function glowMat(map, emissiveMap, day, night, extra = {}) {
  const m = new THREE.MeshStandardMaterial({ map, roughness: .8, emissive: 0xffffff, emissiveMap, emissiveIntensity: day, ...extra });
  glows.push({ mat: m, day, night });
  return m;
}

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = Math.max(4, Math.round(w)); c.height = Math.max(4, Math.round(h));
  const g = c.getContext('2d');
  draw(g, c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function speckle(g, w, h, alpha, n) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = rand() < .5 ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`;
    g.fillRect(rand() * w, rand() * h, 1 + rand() * 3, 1 + rand() * 3);
  }
}
// shared grey grime for side walls (tinted by material color)
const grimeTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); speckle(g, w, h, .05, 2500);
  for (let i = 0; i < 18; i++) { const x = rand() * w, gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(70,60,70,.12)'); gr.addColorStop(1, 'rgba(70,60,70,0)'); g.fillStyle = gr; g.fillRect(x, 0, 4 + rand() * 12, h * (.3 + rand() * .7)); }
}, [1, 1]);
grimeTex.wrapS = grimeTex.wrapT = THREE.RepeatWrapping;
const sideMat = c => { const k = 'side' + c; if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color: c, map: grimeTex, roughness: .9 })); return matCache.get(k); };

// ---------------------------------------------------------------- mesh helpers
const dynamic = new Set();      // meshes that must not be merged (moving / tappable)
function mesh(geo, mat, x, y, z, parent = scene, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (w, h, d, mat, x, y, z, parent, cast) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent, cast);
const cyl = (rt, rb, h, mat, x, y, z, seg = 12, parent, cast) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, parent, cast);
const group = (x, y, z, ry = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; scene.add(g); return g; };

// ================================================================ textures
const PX = 40;
// Where the windows and doors go on a building front
function layout(len, h, o) {
  const groundH = o.groundH, band = (o.ground === 'shop' || o.ground === 'konbini') ? 1.1 : 0, base = groundH + band;
  const floors = o.floors, floorH = (h - base - .9) / floors, wins = [];
  for (let f = 0; f < floors; f++) for (let c = 0; c < o.cols; c++) {
    const cw = len / o.cols, door = o.doors && c % 2 === 0;
    const ww = door ? .95 : Math.min(cw * (o.balcony ? .7 : .55), 3.2), wh = door ? floorH * .72 : floorH * (o.balcony ? .66 : .5);
    wins.push({ u: (c + .5) * cw, y: base + f * floorH + (door ? .05 : floorH * .3), w: ww, h: wh, f, c, door, lit: rand() < (o.lit ?? .5), frost: !door && !o.balcony && rand() < .12 });
  }
  return { wins, floorH, base };
}

// Far buildings: one painted texture with windows. Returns color map, night map and the window list.
function facade(len, h, o) {
  const px = o.px || PX;
  const w = Math.min(2048, len * px), H = Math.min(2048, h * px);
  const sx = w / len, sy = H / h;
  const groundH = o.groundH;
  const band = (o.ground === 'shop' || o.ground === 'konbini') ? 1.1 : 0;   // fascia for the shop sign
  const base = groundH + band;
  const floors = o.floors, floorH = (h - base - .9) / floors;
  const wins = [];
  for (let f = 0; f < floors; f++) for (let c = 0; c < o.cols; c++) {
    const cw = len / o.cols;
    const door = o.doors && c % 2 === 0;
    const ww = door ? .95 : Math.min(cw * (o.balcony ? .7 : .55), 3.2);
    const wh = door ? floorH * .72 : floorH * (o.balcony ? .66 : .5);
    wins.push({ u: (c + .5) * cw, y: base + f * floorH + (door ? .05 : floorH * .3), w: ww, h: wh, f, c, door, lit: rand() < (o.lit ?? .5), frost: !door && !o.balcony && rand() < .12,
      curtain: pick(['#F7E7C6', '#E7EEF6', '#F4C9C9', '#D8E6CF', '#FFFFFF', '#E9D8F0']) });
  }
  const map = canvasTex(w, H, (g) => {
    g.fillStyle = o.wall; g.fillRect(0, 0, w, H);
    if (o.style === 'tile') {
      const ts = .2 * sx;
      for (let y = 0; y < H; y += ts * .5) for (let x = (y / ts) % 2 ? ts / 2 : 0; x < w; x += ts) { g.fillStyle = shade(o.wall, .92 + rand() * .13); g.fillRect(x + 1, y + 1, ts - 2, ts * .5 - 2); }
    } else if (o.style === 'siding') {
      for (let y = 0; y < H; y += .16 * sy) { g.fillStyle = shade(o.wall, .9 + rand() * .1); g.fillRect(0, y, w, .16 * sy - 2); g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, y + .16 * sy - 2, w, 2); }
    } else if (o.style === 'wood') {
      for (let x = 0; x < w; x += .17 * sx) { g.fillStyle = shade(o.wall, .88 + rand() * .16); g.fillRect(x, 0, .17 * sx - 2, H); }
    } else if (o.style === 'panel') {
      speckle(g, w, H, .04, w * H / 500);
      g.strokeStyle = shade(o.wall, .86); g.lineWidth = 2;
      for (let x = 0; x < w; x += 1.6 * sx) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
      for (let y = 0; y < H; y += .8 * sy) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    } else speckle(g, w, H, .05, w * H / 300);
    // rain streaks and grime
    for (let i = 0; i < len * 2; i++) {
      const x = rand() * w, y0 = rand() * H * .5;
      const gr = g.createLinearGradient(0, y0, 0, y0 + H * .5);
      gr.addColorStop(0, 'rgba(60,50,60,.13)'); gr.addColorStop(1, 'rgba(60,50,60,0)');
      g.fillStyle = gr; g.fillRect(x, y0, 2 + rand() * 9, H * .5);
    }
    const gb = g.createLinearGradient(0, H * .8, 0, H); gb.addColorStop(0, 'rgba(50,40,40,0)'); gb.addColorStop(1, 'rgba(50,40,40,.22)');
    g.fillStyle = gb; g.fillRect(0, H * .8, w, H * .2);
    if (band) { g.fillStyle = shade(o.wall, .82); g.fillRect(0, H - base * sy, w, band * sy); }
    for (const win of wins) {
      const x = (win.u - win.w / 2) * sx, y = H - (win.y + win.h) * sy, ww = win.w * sx, wh = win.h * sy;
      if (win.door) { drawSteelDoor(g, x, y, ww, wh, win.f); continue; }
      drawWindow(g, x, y, ww, wh, win, o);
    }
    const k = groundH;
    if (o.ground === 'shop' || o.ground === 'konbini') {
      const y = H - 2.9 * sy, wh = 2.6 * sy, door = 1.4 * sx;
      g.fillStyle = '#4F545E'; g.fillRect(len * .04 * sx, y - 8, len * .92 * sx, wh + 8);
      const parts = [[len * .05 * sx, len * .5 * sx - door / 2 - len * .05 * sx], [len * .5 * sx + door / 2, len * .45 * sx - door / 2]];
      for (const [x, ww] of parts) {
        // looking into the shop: a dim room, a lit ceiling, shelves and a counter
        const kb = o.ground === 'konbini';
        const gl = g.createLinearGradient(0, y, 0, y + wh);
        gl.addColorStop(0, kb ? '#EEF3F7' : '#D9CDB8'); gl.addColorStop(.35, kb ? '#B9C6D1' : '#8E8170'); gl.addColorStop(1, kb ? '#8C99A5' : '#4E4A48');
        g.fillStyle = gl; g.fillRect(x, y, ww, wh);
        g.fillStyle = kb ? 'rgba(255,255,255,.9)' : 'rgba(255,236,200,.8)'; for (let i = 0; i < ww / 60; i++) g.fillRect(x + 20 + i * 60, y + wh * .06, 34, 4);
        for (let s = 0; s < 2; s++) {
          const sy0 = y + wh * (.45 + s * .22);
          g.fillStyle = 'rgba(40,35,35,.45)'; g.fillRect(x, sy0, ww, 3);
          for (let i = 0; i < ww / 7; i++) if (rand() < .6) { g.globalAlpha = .45; g.fillStyle = pick(['#C9675A', '#D9B65C', '#6C9BC7', '#86AE7C', '#EDE6D8']); const ih = 6 + rand() * 7; g.fillRect(x + i * 7 + 1, sy0 - ih, 5, ih); g.globalAlpha = 1; }
        }
        g.fillStyle = 'rgba(30,28,30,.35)'; g.fillRect(x, y + wh * .82, ww, wh * .18);
        // posters stuck on the glass
        for (let p = 0; p < 2; p++) if (rand() < .8) {
          const pw = ww * range(.1, .16), ph = wh * range(.22, .32), pxx = x + ww * range(.05, .8);
          g.fillStyle = pick(['#FFF4D6', '#FCE1E8', '#E3F1FF', '#FFE08A']); g.fillRect(pxx, y + wh * .08, pw, ph);
          g.fillStyle = pick(['#D8433F', '#2F6FB8', '#2E6B53', '#E07B28']); g.fillRect(pxx + pw * .1, y + wh * .1, pw * .8, ph * .25);
          g.fillStyle = 'rgba(0,0,0,.35)'; for (let l = 0; l < 3; l++) g.fillRect(pxx + pw * .15, y + wh * .08 + ph * (.5 + l * .15), pw * .7, 2);
        }
        g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.moveTo(x + ww * .1, y + wh); g.lineTo(x + ww * .3, y); g.lineTo(x + ww * .38, y); g.lineTo(x + ww * .18, y + wh); g.fill();
        g.fillStyle = '#4F545E'; g.fillRect(x + ww / 2 - 3, y, 6, wh);
      }
      const dx = len * .5 * sx - door / 2;
      g.fillStyle = '#5E646E'; g.fillRect(dx, y, door, wh);
      for (let i = 0; i < 2; i++) {
        const px0 = dx + 6 + i * door / 2, pw = door / 2 - 9;

// Sign texture
function signTex(o) {
  const w = o.w * 128, h = o.h * 128;
  return canvasTex(w, h, (g, W, Hh) => {
    g.fillStyle = o.bg; g.fillRect(0, 0, W, Hh);
    if (o.grad) { const gr = g.createLinearGradient(0, 0, 0, Hh); gr.addColorStop(0, 'rgba(255,255,255,.18)'); gr.addColorStop(1, 'rgba(0,0,0,.1)'); g.fillStyle = gr; g.fillRect(0, 0, W, Hh); }
    if (o.border) { g.strokeStyle = o.border; g.lineWidth = Math.min(W, Hh) * .06; g.strokeRect(g.lineWidth / 2, g.lineWidth / 2, W - g.lineWidth, Hh - g.lineWidth); }
    if (o.stripe) { g.fillStyle = o.stripe; o.vertical ? g.fillRect(0, Hh * .92, W, Hh * .08) : g.fillRect(0, Hh * .84, W, Hh * .16); }
    if (o.sub && !o.vertical) { g.fillStyle = o.fg; g.globalAlpha = .75; g.font = `700 ${Hh * .11}px "Zen Maru Gothic"`; g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(o.sub, W * .97, Hh * .9); g.globalAlpha = 1; }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const font = o.font || '"Zen Maru Gothic"';
    if (o.vertical) {
      const chars = [...o.text], n = chars.length, step = Hh * .86 / n, size = Math.min(W * .74, step * .92);
      g.font = `900 ${size}px ${font}`; g.fillStyle = o.fg;
      chars.forEach((ch, i) => g.fillText(ch, W / 2, Hh * .06 + step * (i + .5)));
    } else {
      const lines = o.lines || [{ t: o.text, size: .6 }];
      const gap = o.gap ?? .4;
      let tx = W / 2, maxW = W * .9;
      if (o.logo) {
        const r = Hh * .34, cx = Hh * .55;
        g.fillStyle = o.logo.bg; g.beginPath(); g.arc(cx, Hh * .44, r, 0, 7); g.fill();
        g.fillStyle = o.logo.fg; g.font = `900 ${r * 1.3}px "Zen Maru Gothic"`; g.fillText(o.logo.t, cx, Hh * .46);
        tx = (W + Hh * 1.05) / 2; maxW = W - Hh * 1.3;
      }
      let y = Hh * (o.top ?? .5) - (lines.length - 1) * Hh * gap / 2;
      for (const L of lines) {
        let size = Hh * L.size;
        const f = () => `${L.weight || 900} ${size}px ${L.font || font}`;
        g.font = f();
        const tw = g.measureText(L.t).width;
        if (tw > maxW) { size *= maxW / tw; g.font = f(); }
        g.fillStyle = L.color || o.fg; g.fillText(L.t, tx, y);
        y += Hh * gap;
      }
    }
    // a little weathering: darker edges, dust and rain marks, so signs belong to the street
    const ev = g.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * .3, W / 2, Hh / 2, Math.max(W, Hh) * .75);
    ev.addColorStop(0, 'rgba(0,0,0,0)'); ev.addColorStop(1, 'rgba(40,30,30,.22)'); g.fillStyle = ev; g.fillRect(0, 0, W, Hh);
    for (let i = 0; i < W * Hh / 900; i++) { g.fillStyle = `rgba(60,50,40,${.04 + rand() * .06})`; g.fillRect(rand() * W, rand() * Hh, 1 + rand() * 3, 1 + rand() * 3); }
    for (let i = 0; i < 4; i++) { const sx2 = rand() * W, gr2 = g.createLinearGradient(0, 0, 0, Hh); gr2.addColorStop(0, 'rgba(60,50,40,.12)'); gr2.addColorStop(1, 'rgba(60,50,40,0)'); g.fillStyle = gr2; g.fillRect(sx2, 0, 2 + rand() * 4, Hh); }
  });
}

// ================================================================ tappable signs
const tappables = [];
function sign(o, x, y, z, rotY, info, parent = scene) {
  const tex = o.tex || signTex(o);
  const mat = glowMat(tex, tex, o.day ?? .25, o.night ?? .6, o.cutout ? { alphaTest: .5 } : {});
  const g = new THREE.Group();
  const front = new THREE.Mesh(new THREE.PlaneGeometry(o.w, o.h), mat);
  g.add(front);
  if (o.double) { const back = new THREE.Mesh(front.geometry, mat); back.rotation.y = Math.PI; back.position.z = -0.05; g.add(back); }
  if (o.frame !== false) {
    const fr = new THREE.Mesh(new THREE.BoxGeometry(o.w + .08, o.h + .08, o.double ? .04 : .07), std(o.frameColor || '#5B5F6B'));
    fr.position.z = o.double ? -.025 : -.04; fr.castShadow = true; g.add(fr);
  }
  g.position.set(x, y, z); g.rotation.y = rotY;
  parent.add(g);
  if (info) g.children.forEach(c => { c.userData.info = info; tappables.push(c); dynamic.add(c); });
  return g;
}

// sidewalk lanes so props never pile up: wall lane (next to buildings) and curb lane (poles, signs)
const lanes = { '-1wall': [], '1wall': [], '-1curb': [], '1curb': [] };
function claim(side, lane, z0, z1) {
  const L = lanes[side + lane], a = Math.min(z0, z1), b = Math.max(z0, z1);
  for (const [p, q] of L) if (a < q && b > p) return false;
  L.push([a, b]); return true;
}

// ================================================================ buildings
function building(side, z0, z1, o) {
  const len = z0 - z1, depth = o.depth || 11, setback = o.setback || 0;
  const fx = side * (WALK + setback), n = -side;          // n points from the wall to the street
  const x = fx + side * depth / 2, zc = (z0 + z1) / 2;
  o.groundH = o.groundH ?? ({ shop: 3.4, konbini: 3.4, entrance: 3.0, house: 2.8, parking: 3.0 }[o.ground] ?? 0);
  const f = layout(len, o.h, o);
  const front = wallMat(o.style, o.wall, len, o.h), plain = wallMat(o.style, shade(o.wall, .95), depth, o.h);

function car(x, z, color, ry = 0, type) {

    uniform vec3 top, horizon, glow, cloudLit, cloudShade, sunDir; uniform float time, cover, stars; varying vec3 vDir;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }

    void main(){

      float sd = max(dot(d, normalize(sunDir)), 0.);

// ================================================================ merge static meshes (fewer draw calls)
function mergeStatic() {
  scene.updateMatrixWorld(true);
  const buckets = new Map();
  const remove = [];
  scene.traverse(o => {
    if (!o.isMesh || dynamic.has(o) || Array.isArray(o.material) || o.parent === train) return;
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    g.morphAttributes = {};
    const chunk = Math.floor(new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).z / 40);
    const key = o.material.uuid + '|' + chunk + '|' + o.castShadow + '|' + o.receiveShadow;
    if (!buckets.has(key)) buckets.set(key, { mat: o.material, cast: o.castShadow, rec: o.receiveShadow, geos: [] });
    buckets.get(key).geos.push(g);
    remove.push(o);
  });
  for (const o of remove) o.parent.remove(o);
  for (const { mat, cast, rec, geos } of buckets.values()) {
    const merged = mergeGeometries(geos, false);
    if (!merged) continue;
    const m = new THREE.Mesh(merged, mat);
    m.castShadow = cast; m.receiveShadow = rec;
    m.userData.noAO = !!mat.userData.foliage;
    scene.add(m);
  }
}

const walkers = [], movers = [];
const LIFE_MIN = -124, LIFE_MAX = 108;
function walker(side, z, dir) {
  const g = new THREE.Group(); scene.add(g);
  g.position.set(side * range(4.42, 4.52), .15, z); g.rotation.y = dir > 0 ? 0 : Math.PI;

  const pants = std(pick(['#2E3550', '#4A4A52', '#6B5A48', '#2B2B30', '#7C8A9E', '#C9B79C'])), hair = std(pick(['#1E1A18', '#3A2A20', '#5A4030', '#2A2A2E', '#8A6A4A', '#B9B6B0']));
  g.scale.setScalar(range(.9, 1.05));
  const legs = [], arms = [];
  for (const s2 of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(s2 * .1, .86, 0); g.add(hip); legs.push(hip);
    mesh(new THREE.CylinderGeometry(.075, .06, .86, 8), pants, 0, -.43, 0, hip);
    box(.11, .07, .24, std('#2B2B30'), 0, -.86, .05, hip);
    const sh = new THREE.Group(); sh.position.set(s2 * .25, 1.42, 0); g.add(sh); arms.push(sh);
    mesh(new THREE.CylinderGeometry(.055, .045, .56, 8), shirt, 0, -.28, 0, sh);
    mesh(new THREE.SphereGeometry(.05, 8, 6), skin, 0, -.58, 0, sh);
  }
  mesh(new THREE.CylinderGeometry(.19, .16, .62, 12), shirt, 0, 1.17, 0, g);
  mesh(new THREE.CylinderGeometry(.055, .055, .1, 8), skin, 0, 1.52, 0, g);
  mesh(new THREE.SphereGeometry(.135, 16, 12), skin, 0, 1.66, 0, g);
  const hc = mesh(new THREE.SphereGeometry(.148, 16, 10, 0, Math.PI * 2, 0, Math.PI * .58), hair, 0, 1.67, -.015, g); hc.rotation.x = -.25;
  if (rand() < .4) box(.06, .3, .26, std(pick(['#6B4A32', '#2B2B30', '#C0392B'])), (rand() < .5 ? -1 : 1) * .25, 1.0, 0, g);
  if (rand() < .2) { cyl(.012, .012, .8, metal('#7A7A80'), .3, 1.1, .1, 6, g, false); }
  walkers.push({ g, legs, arms, dir, speed: range(1.0, 1.5), phase: rand() * 6 });
}
function buildLife() {
  for (let i = 0; i < 18; i++) walker(rand() < .5 ? -1 : 1, range(LIFE_MIN, LIFE_MAX), rand() < .5 ? -1 : 1);
  const drive = (lane, z, color) => { const c = car(lane * 1.4, z, color, lane > 0 ? -Math.PI / 2 : Math.PI / 2); movers.push({ g: c, dir: lane > 0 ? 1 : -1, speed: range(6, 8), v: 6 }); };
  drive(1, 20, '#F2F2EE'); drive(-1, -40, '#3A6EA5'); drive(1, -150, '#E9C46A');
}
function updateLife(dt) {
  for (const w of walkers) {
    w.g.position.z += w.dir * w.speed * dt; w.phase += dt * w.speed * 3.4;
    if (w.g.position.z < LIFE_MIN) w.g.position.z = LIFE_MAX; else if (w.g.position.z > LIFE_MAX) w.g.position.z = LIFE_MIN;
    const sw = Math.sin(w.phase);
    w.legs[0].rotation.x = sw * .45; w.legs[1].rotation.x = -sw * .45;
    w.arms[0].rotation.x = -sw * .35; w.arms[1].rotation.x = sw * .35;
    w.g.position.y = .15 + Math.abs(Math.cos(w.phase)) * .025;
  }
  for (const m of movers) {
    const ahead = (player.pos.z - m.g.position.z) * m.dir;
    const target = (Math.abs(player.pos.x - m.g.position.x) < 1.6 && ahead > 0 && ahead < 8) ? 0 : m.speed;
    m.v += (target - m.v) * Math.min(1, dt * 2.5);
    m.g.position.z += m.dir * m.v * dt;
    if (m.g.position.z < WALK_MIN) m.g.position.z = WALK_MAX + 40; else if (m.g.position.z > WALK_MAX + 40) m.g.position.z = WALK_MIN;
  }
}

// ================================================================ collisions
const colliders = [], RADIUS = .32;
function buildColliders() {
  scene.updateMatrixWorld(true);
  const bb = new THREE.Box3();
  scene.traverse(o => {
    if (!o.isMesh || o === sky || o.parent === train || o.userData.noCollide) return;
    bb.setFromObject(o);
    if (bb.max.y < .35 || bb.min.y > 1.7) return;
    if (bb.max.x - bb.min.x > 40 && bb.max.z - bb.min.z > 40) return;
    colliders.push(bb.clone());
  });
}
function blocked(x, z) {
  const D = restroom;
  if (D.door) {
    if (D.open < .7 && x > D.x - .1 - RADIUS && x < D.x + .2 + RADIUS && z > D.z0 - RADIUS && z < D.z1 + RADIUS) return true;
    if (D.open > .3 && x > D.x && x < D.x + .9 + RADIUS && z > D.z0 - .06 - RADIUS && z < D.z0 + .06 + RADIUS) return true;
  }
  for (const m of movers) if (Math.abs(x - m.g.position.x) < 1.15 && Math.abs(z - m.g.position.z) < 2.2) return true;
  for (const b of colliders)
    if (x > b.min.x - RADIUS && x < b.max.x + RADIUS && z > b.min.z - RADIUS && z < b.max.z + RADIUS) return true;
  return false;
}

});
document.addEventListener('pointerlockchange', () => document.body.classList.toggle('locked', locked()));
const hold = { fwd: 0, back: 0 };
for (const id of ['fwd', 'back']) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', () => hold[id] = 1); for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => hold[id] = 0);
}

// ---------------------------------------------------------------- reading signs
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let lang = 'en';
const card = document.getElementById('card');
const notebook = new Set();
let shown = null;
function tapAt(x, y) {
  mouse.set(x, y);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(tappables, false)[0];
  if (!hit || hit.distance > 35) { card.style.display = 'none'; if (seated || seatTarget || holding) toggleSeat(); return; }
  shown = hit.object.userData.info; showCard();
  if (locked()) document.exitPointerLock();
}
function showCard() {
  const i = shown;
  document.getElementById('cardJp').innerHTML = i.ruby.map(([k, r]) => `<ruby>${k}<rt>${r || '&nbsp;'}</rt></ruby>`).join('');
  document.getElementById('cardRo').textContent = lang === 'en' ? i.ro : '';      // romaji only on the English track
  document.getElementById('cardTr').textContent = lang === 'en' ? i.en : i.zh;
  document.getElementById('saved').textContent = notebook.has(i.ro) ? (lang === 'en' ? 'In your notebook ✓' : '已在手帐里 ✓') : '';
  card.style.display = 'block';
}
document.getElementById('closeBtn').onclick = () => card.style.display = 'none';
document.getElementById('saveBtn').onclick = () => { notebook.add(shown.ro); showCard(); };
document.querySelectorAll('#lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.l; document.querySelectorAll('#lang button').forEach(x => x.setAttribute('aria-pressed', x === b)); if (card.style.display === 'block') showCard();
});
document.querySelectorAll('#tod button').forEach(b => b.onclick = () => setTime(b.dataset.t));
addEventListener('keydown', e => { if (e.key === 'Escape') card.style.display = 'none'; });

// ---------------------------------------------------------------- things you can do: sit, stand, pour, drink, open, flush, wash
// each verb is shown with its reading, so the prompt itself teaches the word
const VERBS = {
  suwaru: { r: [['座', 'すわ'], ['る', '']], ro: 'suwaru', en: 'Sit down', zh: '坐下' },
  tatsu: { r: [['立', 'た'], ['つ', '']], ro: 'tatsu', en: 'Stand up', zh: '站起来' },
  sosogu: { r: [['水', 'みず'], ['を', ''], ['注', 'そそ'], ['ぐ', '']], ro: 'mizu o sosogu', en: 'Pour some water', zh: '倒水' },
  nomu: { r: [['飲', 'の'], ['む', '']], ro: 'nomu', en: 'Drink', zh: '喝' },
  kau: { r: [['飲', 'の'], ['み', ''], ['物', 'もの'], ['を', ''], ['買', 'か'], ['う', '']], ro: 'nomimono o kau', en: 'Buy a drink', zh: '买饮料' },
  akeru: { r: [['開', 'あ'], ['ける', '']], ro: 'akeru', en: 'Open the door', zh: '开门' },
  shimeru: { r: [['閉', 'し'], ['める', '']], ro: 'shimeru', en: 'Close the door', zh: '关门' },
  nagasu: { r: [['流', 'なが'], ['す', '']], ro: 'nagasu', en: 'Flush', zh: '冲水' },
  arau: { r: [['手', 'て'], ['を', ''], ['洗', 'あら'], ['う', '']], ro: 'te o arau', en: 'Wash your hands', zh: '洗手' },
};
let seated = null, seatTarget = null, seatAnim = null, actAnim = null, holding = null, eyeY = 1.62, seatLabel = '';
const seatBtn = document.getElementById('seat');
const angleTo = (a, b) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a));      // b, unwrapped to be near a
function sitDown(s) {
  seated = { seat: s, from: player.pos.clone() };
  seatAnim = { t: 0, a: player.pos.clone(), b: new THREE.Vector3(s.x, 0, s.z), ya: eyeY, yb: s.eye, yawA: player.yaw, yawB: angleTo(player.yaw, s.yaw), pA: player.pitch, pB: -.08 };
}
function standUp() {
  seatAnim = { t: 0, a: player.pos.clone(), b: seated.from.clone(), ya: eyeY, yb: 1.62, yawA: player.yaw, yawB: player.yaw, pA: player.pitch, pB: player.pitch };
  seated = null;
}
// a short scripted moment (pouring, flushing...): you stay put while it plays
function playAnim(dur, step, end) { actAnim = { t: 0, dur, step, end }; }
function pourWater() {
  const W = water, g = W.glass, p = W.pitcher, spot = W.spot, home = W.home, gh = W.glassHome;
  const pourAt = new THREE.Vector3(spot.x, spot.y + .165, spot.z - .3);
  const lerp = (a, b, k) => a + (b - a) * k, ss = k => k * k * (3 - 2 * k), seg = (k, a, b) => Math.min(1, Math.max(0, (k - a) / (b - a)));
  playAnim(3.0, k => {
    const g1 = ss(seg(k, 0, .12));                                          // take a glass from the tray
    g.position.set(lerp(gh.x, spot.x, g1), gh.y + Math.sin(g1 * Math.PI) * .08, lerp(gh.z, spot.z, g1));
    const p1 = ss(seg(k, .12, .3)) - ss(seg(k, .72, .88));                   // pitcher over the glass, tilt, back
    p.position.set(lerp(home.x, pourAt.x, p1), lerp(home.y, pourAt.y, p1), lerp(home.z, pourAt.z, p1)); p.rotation.x = p1 * 1.0;
    const f = seg(k, .32, .7);                                              // the water runs and the glass fills
    W.stream.visible = f > 0 && f < 1;
    if (W.stream.visible) { W.stream.position.set(spot.x, spot.y + .205, spot.z); W.stream.scale.y = .17; }
    W.glassWater.scale.y = Math.max(.001, f); W.pitcherWater.scale.y = 1 - f * .25;
    const h = ss(seg(k, .88, 1));                                           // pick it up
    g.position.y = spot.y + h * .3; g.visible = h < .95;
  }, () => {
    W.glass.position.copy(gh); W.glass.visible = true; W.glassWater.scale.y = .001; W.pitcherWater.scale.y = 1;   // a fresh glass on the tray
    holdGlass();
  });
}
function holdGlass() {
  if (!camera.parent) scene.add(camera);
  const hg = new THREE.Group(); hg.position.set(.2, -.2, -.45); camera.add(hg);
  mesh(new THREE.CylinderGeometry(.035, .03, .1, 12), new THREE.MeshStandardMaterial({ color: '#E4F2F8', transparent: true, opacity: .3, roughness: .05, depthWrite: false }), 0, 0, 0, hg, false);
  const w = mesh(new THREE.CylinderGeometry(.03, .026, .08, 12), new THREE.MeshStandardMaterial({ color: '#BFE2F2', transparent: true, opacity: .65, roughness: .05 }), 0, -.045, 0, hg, false); w.geometry.translate(0, .04, 0);
  holding = { g: hg, w };
}
function drink() {
  const H = holding; if (!H) return;
  playAnim(1.6, k => {
    const up = Math.min(1, k / .3), down = Math.max(0, (k - .8) / .2);
    H.g.position.set(.2 - up * .2, -.2 + up * .12 - down * .3, -.45 + up * .18);
    H.g.rotation.x = up * .9 * (1 - down);
    if (H.w) H.w.scale.y = Math.max(.001, 1 - Math.max(0, (k - .25) / .5));
  }, () => { camera.remove(H.g); holding = null; if (H.drink) toast(lang === 'en' ? 'ごちそうさま！ · gochisōsama · That hit the spot!' : 'ごちそうさま！ · 我喝完了，谢谢款待', 2000); });
}
// ---------------------------------------------------------------- vending machine: choose, ガコン, pick it up, drink
const vendEl = document.getElementById('vend'), toastEl = document.getElementById('toast');
let vendOpen = null, toastTimer = 0;
const rubyHTML = r => r.map(([k, rt]) => rt ? `<ruby>${k}<rt>${rt}</rt></ruby>` : k).join('');
function toast(html, ms = 1800) { toastEl.innerHTML = html; toastEl.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.display = 'none', ms); }
function openVend(m) {
  vendOpen = m; if (locked()) document.exitPointerLock();
  const en = lang === 'en', seen = new Set(), items = [];
  for (const row of m.th.lineup) for (const it of row) { const k = it.id + it.hot; if (!seen.has(k)) { seen.add(k); items.push(it); } }
  m.items = items.slice(0, 9 * 2);
  document.getElementById('vendJp').innerHTML = rubyHTML([['どれにする', ''], ['？', '']]);
  document.getElementById('vendSub').textContent = en ? 'dore ni suru? · Which one? (click one, or press its number)' : '要哪一个？（点一下，或按数字键）';
  document.getElementById('vendGrid').innerHTML = m.items.map((it, i) => { const d = DRINKS[it.id]; return `<button class="it" data-i="${i}">${i < 9 ? `<span class="num">${i + 1}</span>` : ''}<img src="${drinkThumb(it.id)}" alt=""><span>${rubyHTML(d.r)}</span><span class="en">${en ? d.en : d.zh}</span><span class="pr"><span class="tag ${it.hot ? 'hot' : 'cold'}">${it.hot ? 'あたたか〜い' : 'つめた〜い'}</span>¥${d.price}</span></button>`; }).join('');
  vendEl.style.display = 'block';
}
function closeVend() { vendOpen = null; vendEl.style.display = 'none'; }
document.getElementById('vendClose').onclick = closeVend;
document.getElementById('vendGrid').addEventListener('click', e => { const b = e.target.closest('.it'); if (b && vendOpen) buyDrink(vendOpen, vendOpen.items[+b.dataset.i]); });
addEventListener('keydown', e => {
  if (!vendOpen) return;
  if (e.key === 'Escape') closeVend();
  const n = +e.key; if (n >= 1 && n <= 9 && vendOpen.items[n - 1]) buyDrink(vendOpen, vendOpen.items[n - 1]);
});
function buyDrink(m, it) {
  closeVend();
  const d = DRINKS[it.id], dm = drinkModel(d); scene.add(dm);
  m.g.updateMatrixWorld();
  const out = m.g.localToWorld(new THREE.Vector3(0, .2, .48)), top = m.g.localToWorld(new THREE.Vector3(0, .75, .48));
  const ss = k => k * k * (3 - 2 * k), seg = (k, a, b) => Math.min(1, Math.max(0, (k - a) / (b - a)));
  const yaw = m.g.rotation.y; dm.rotation.set(Math.PI / 2, 0, 0); dm.rotation.order = 'YXZ'; dm.rotation.y = yaw + Math.PI / 2;
  toast(`¥${d.price} … <b>ガコン！</b>`, 1400);
  playAnim(2.0, k => {
    const f = seg(k, .15, .4);                                          // it drops into the tray and settles
    dm.visible = k > .15;
    dm.position.lerpVectors(top, out, f * f); dm.position.y += f >= 1 ? Math.abs(Math.sin(seg(k, .4, .5) * Math.PI)) * .03 : 0;
    const p = ss(seg(k, .6, 1));                                        // you reach down and pick it up
    if (p > 0) {
      camera.updateMatrixWorld();
      const hand = camera.localToWorld(new THREE.Vector3(.17, -.15 - dm.userData.h * .35, -.45));
      dm.scale.setScalar(1 - .3 * p);
      dm.position.lerpVectors(out, hand, p); dm.rotation.x = Math.PI / 2 * (1 - p); dm.rotation.y = (yaw + Math.PI / 2) * (1 - p) + player.yaw * p;
    }
  }, () => { scene.remove(dm); holdDrink(d, it.hot); toast(`${rubyHTML(d.r)} ${it.hot ? '(あたたか〜い)' : '(つめた〜い)'}`, 2200); });
}
function holdDrink(d, hot) {
  if (!camera.parent) scene.add(camera);
  const hg = new THREE.Group(); hg.position.set(.2, -.2, -.45); camera.add(hg);
  const dm = drinkModel(d); dm.scale.setScalar(.7); dm.position.y = -dm.userData.h * .35; hg.add(dm); hg.position.set(.17, -.15, -.45);
  holding = { g: hg, drink: d, hot };
}

function toggleSeat() {
  if (vendOpen) return;
  if (seatAnim || actAnim) return;
  if (seated) standUp();
  else if (seatTarget) seatTarget.seat ? sitDown(seatTarget.seat) : seatTarget.act();
  else if (holding) drink();
}
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'e' && !e.repeat) toggleSeat(); });
seatBtn.addEventListener('click', toggleSeat);
function findTarget() {
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
  let best = null, bd = 99;
  const consider = (x, z, reach, t) => {
    const dx = x - player.pos.x, dz = z - player.pos.z, d = Math.hypot(dx, dz);
    if (d > reach) return;
    const dot = d > .01 ? (dx * fx + dz * fz) / d : 1;
    if (d > .35 && dot < .55) return;                                          // it has to be roughly in front of you
    const score = d * (1.6 - dot);                                             // closer and more straight ahead wins
    if (score < bd) { best = t; bd = score; }
  };
  for (const s of seats) consider(s.x, s.z, 1.5, { seat: s });
  for (const a of actions) if (!a.when || a.when()) consider(a.x, a.z, a.reach, a);
  return best;
}
function updateSeatPrompt() {
  seatTarget = seated || seatAnim || actAnim ? null : findTarget();
  const key = seated ? 'tatsu' : seatTarget ? (seatTarget.seat ? 'suwaru' : seatTarget.word()) : holding && !actAnim ? 'nomu' : '';
  const v = VERBS[key], en = lang === 'en';
  const label = v ? `<kbd>E</kbd>${v.r.map(([k, r]) => r ? `<ruby>${k}<rt>${r}</rt></ruby>` : k).join('')} ${en ? `${v.ro} · ${v.en}` : `· ${v.zh}`}` : '';
  if (label !== seatLabel) { seatLabel = label; seatBtn.innerHTML = label; }
  seatBtn.style.display = label && !seatAnim && !actAnim ? 'block' : 'none';
}

// ================================================================ loop
const clock = new THREE.Clock();
let lightTimer = 0;
const _sunRot = new THREE.Matrix4(), _sunInv = new THREE.Matrix4(), _sunP = new THREE.Vector3(), _origin = new THREE.Vector3();
function placeSun(cz) {
  const dir = sky.material.uniforms.sunDir.value, cam = sun.shadow.camera;
  const texel = (cam.right - cam.left) / sun.shadow.mapSize.x;
  _sunRot.lookAt(dir, _origin, cam.up);          // same orientation the shadow camera will use
  _sunInv.copy(_sunRot).transpose();             // pure rotation: inverse = transpose
  _sunP.set(0, 0, cz).applyMatrix4(_sunInv);     // into light space
  _sunP.x = Math.round(_sunP.x / texel) * texel;
  _sunP.y = Math.round(_sunP.y / texel) * texel;
  _sunP.applyMatrix4(_sunRot);                   // back to world space
  sun.target.position.copy(_sunP);
  sun.position.copy(_sunP).addScaledVector(dir, 120);
}
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  const fwd = (keys.has('w') || keys.has('arrowup') || hold.fwd) - (keys.has('s') || keys.has('arrowdown') || hold.back);
  const side = (keys.has('d') || keys.has('arrowright')) - (keys.has('a') || keys.has('arrowleft'));
  const speed = keys.has('shift') ? 7 : 3.4;
  if (actAnim) {
    const A = actAnim; A.t = Math.min(1, A.t + dt / A.dur); A.step(A.t);
    if (A.t >= 1) { actAnim = null; A.end && A.end(); }
  } else if (seatAnim) {
    const A = seatAnim; A.t = Math.min(1, A.t + dt / .45); const k = A.t * A.t * (3 - 2 * A.t);
    player.pos.lerpVectors(A.a, A.b, k); eyeY = A.ya + (A.yb - A.ya) * k;
    player.yaw = A.yawA + (A.yawB - A.yawA) * k; player.pitch = A.pA + (A.pB - A.pA) * k;
    if (A.t >= 1) { seatAnim = null; seatLabel = '#'; }
  } else if (seated) {
    if (fwd || side) standUp();
  } else if (fwd || side) {
    const dir = new THREE.Vector3(side, 0, -fwd).normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw);
    const inCafeZ = cafeDoor.z && player.pos.z > cafeDoor.za && player.pos.z < cafeDoor.zb;
    const inRestZ = restroom.rz0 && player.pos.z > restroom.rz0 && player.pos.z < restroom.rz1;
    const nx = THREE.MathUtils.clamp(player.pos.x + dir.x * speed * dt, -5.6, inCafeZ ? (inRestZ ? restroom.x1 - .3 : 13.8) : 5.6);
    const nz = THREE.MathUtils.clamp(player.pos.z + dir.z * speed * dt, WALK_MIN, WALK_MAX);
    if (!blocked(nx, player.pos.z)) player.pos.x = nx;
    if (!blocked(player.pos.x, nz)) player.pos.z = nz;
    player.bob += dt * speed * 2.2;
  }
  // restroom door swings open into the restroom
  if (restroom.door) { restroom.open += (restroom.target - restroom.open) * Math.min(1, dt * 4); restroom.door.rotation.y = restroom.open * 1.5; }
  // automatic sliding door
  if (cafeDoor.panels.length) {
    const near = Math.abs(player.pos.x - cafeDoor.x) < 2.2 && Math.abs(player.pos.z - cafeDoor.z) < 2.0;
    cafeDoor.open += ((near ? 1 : 0) - cafeDoor.open) * Math.min(1, dt * 5);
    for (const p of cafeDoor.panels) p.g.position.z = p.home + p.dir * cafeDoor.open * p.slide;
    const inside = player.pos.x > cafeDoor.x + .2 ? (restroom.door && player.pos.x > restroom.x + .1 ? 'wc' : 'cafe') : '';
    if (inside !== frame.inside) { frame.inside = inside; document.querySelector('.badge').innerHTML = inside === 'wc' ? 'お手洗い<small>Restroom · おてあらい</small>' : inside ? 'カフェ<small>Café · tap the menus to read them</small>' : '日本語学校の通り<small>First-person street test</small>'; }
  }
  const onWalk = Math.abs(player.pos.x) > ROAD ? .15 : 0;
  updateSeatPrompt();
  camera.position.set(player.pos.x, eyeY + onWalk + (seated || seatAnim ? 0 : Math.sin(player.bob) * .03), player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
  sky.position.copy(camera.position);
  // keep the sun's shadow box around you, moving it in whole shadow-map texels
  // (any other step shifts the texel grid and makes small shadows shimmer as you walk)
  placeSun(player.pos.z - 15);
  sky.material.uniforms.time.value = t;
  updateLife(dt);
  if (train) { train.position.x += dt * 18; if (train.position.x > 200) train.position.x = -160; }
  const on = Math.sin(t * 6) > 0;
  for (const m of blinkers) m.emissiveIntensity = (on ? 1 : .15) * (TIMES[current].night ? 2.2 : 1.2);
  if ((lightTimer -= dt) <= 0) {                // move the night lights to the nearest lamps
    lightTimer = .4;
    const near = lampPositions.slice().sort((a, b) => a.distanceToSquared(camera.position) - b.distanceToSquared(camera.position));
    nightLights.forEach((l, i) => { if (near[i]) l.position.copy(near[i]); l.intensity = TIMES[current].night * 10; });
  }
  composer.render();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

Promise.race([
  Promise.all([document.fonts.load('900 64px "Zen Maru Gothic"', '日本語学校さくら書店カフェ止まれ'), document.fonts.load('700 64px "Zen Maru Gothic"', 'COFFEE'), document.fonts.load('600 64px "Klee One"', '日本語学校本日')]),
  new Promise(r => setTimeout(r, 4000))
]).then(() => {
  buildStreet();
  buildColliders();
  mergeStatic();
  setTime(params.get('t') && TIMES[params.get('t')] ? params.get('t') : 'hiru');
  const c = params.get('cam');
  if (c) { const [x, z, yaw, pitch] = c.split(',').map(Number); player.pos.set(x, 0, z); player.yaw = yaw; player.pitch = pitch; }
  document.getElementById('loading').remove();
  frame();
});
</script>
