<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost Traveler: Street Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1D2B4A; --sign:#FFFFFF; --sign-dim:#C5D0E6; --line:#7DB83A; --sakura:#F4A9BE; --amber:#FFC93C;
  --surface:#F3F7F4; --ink:#1D2B4A; --muted:#5A6782; --hair:rgba(29,43,74,.14);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1D2B4A;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{display:block;touch-action:none;cursor:pointer}
button{font:inherit;cursor:pointer;border:0}
.hud{position:fixed;z-index:3;display:flex;gap:10px;align-items:center}
.top-left{top:14px;left:16px}
.top-right{top:14px;right:16px}
.badge{background:var(--navy);color:var(--sign);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(16,24,42,.25)}
.badge small{display:block;font-weight:500;color:var(--sign-dim);font-size:12px}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 4px 14px rgba(16,24,42,.25)}
.seg button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);background:none}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--sign)}
.help{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:3;background:rgba(29,43,74,.82);color:var(--sign);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
kbd{font-family:inherit;background:var(--sign);color:var(--navy);border-radius:5px;padding:0 6px;font-size:12px}
#card{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));background:var(--navy);color:var(--sign);border-radius:14px;box-shadow:0 14px 40px rgba(10,16,30,.5);overflow:hidden;display:none}
#card .stripe{height:8px;background:var(--line)}
#card .body{padding:16px 20px 18px}
#card ruby{font-size:34px;font-weight:900;line-height:1.5}
#card rt{font-size:13px;color:var(--sign-dim);font-weight:700}
#card .ro{color:var(--sign-dim);margin:2px 0 0;font-size:15px}
#card .tr{color:var(--amber);font-weight:700;font-size:17px;margin:8px 0 0}
#card .row{display:flex;gap:8px;margin-top:14px}
#card .row button{border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.save{background:var(--amber);color:var(--navy)}
.close{background:none;color:var(--sign);border:1px solid rgba(255,255,255,.35)!important}
#saved{font-size:12px;color:var(--sign-dim);margin-top:2px}
.move{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:3;display:none;flex-direction:column;gap:8px}
.move button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--navy);font-size:22px;font-weight:900;box-shadow:0 4px 14px rgba(16,24,42,.3)}
@media (pointer:coarse){.move{display:flex}.help .keys{display:none}}
#vend{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--navy);color:var(--sign);border-radius:16px;box-shadow:0 14px 40px rgba(10,16,30,.5);display:none;padding:14px 16px 16px}
#vend .vh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
#vend .vh ruby{font-size:26px;font-weight:900;line-height:1.5}
#vend .vh rt{font-size:11px;color:var(--sign-dim)}
#vend .sub{color:var(--sign-dim);font-size:13px;margin:0}
#vend .vx{background:var(--sign);color:var(--navy);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;flex:none}
#vend .vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-top:12px}
#vend .it{background:linear-gradient(#FFFFFF,#E9EFF5);color:var(--ink);border-radius:12px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
#vend .it:hover,#vend .it:focus-visible{outline:3px solid var(--amber)}
#vend .it img{height:100px;width:auto}
#vend .it ruby{font-size:15px;font-weight:900;line-height:1.6}
#vend .it rt{font-size:9px;color:var(--muted)}
#vend .it .en{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
#vend .it .pr{white-space:nowrap;display:flex;gap:4px;align-items:center;font-size:13px;font-weight:900}
#vend .tag{white-space:nowrap;font-size:10px;font-weight:700;color:#fff;border-radius:5px;padding:1px 5px}
#vend .cold{background:#2F6FB8} #vend .hot{background:#D8433F}
#vend .num{position:absolute;top:5px;left:8px;font-size:11px;font-weight:700;color:var(--muted)}
#toast{position:fixed;z-index:4;left:50%;top:22%;transform:translateX(-50%);background:var(--navy);color:var(--sign);border-radius:999px;padding:8px 18px;font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(16,24,42,.3);display:none;white-space:nowrap}
#toast rt{font-size:10px;color:var(--sign-dim)}
#seat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:3;display:none;background:var(--amber);color:var(--navy);border:0;border-radius:999px;padding:8px 18px;font:700 16px var(--font);box-shadow:0 6px 18px rgba(16,24,42,.3);cursor:pointer}
#seat rt{font-size:10px}
#seat kbd{background:var(--navy);color:var(--sign);margin-right:6px}
@media (pointer:coarse){#seat kbd{display:none}}
#dot{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(29,43,74,.6);z-index:3;display:none;pointer-events:none}
body.locked #dot{display:block}
body.locked canvas{cursor:none}
.help .lockedtip,.help .touch{display:none}
body.locked .help .lockedtip{display:inline}
body.locked .help .free{display:none}
@media (pointer:coarse){.help .touch{display:inline}}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--sign);font-weight:700;z-index:5;background:var(--navy)}
body.shot .hud,body.shot .help,body.shot .move{display:none}
@media (max-width:520px){.badge small{display:none}.seg button{padding:5px 9px}}
</style>
</head>
<body>
<div id="loading">読み込み中… Building the street</div>

<div class="hud top-left"><div class="badge">日本語学校の通り<small>First-person street test</small></div></div>
<div class="hud top-right">
  <div class="seg" id="lang"><button data-l="en" aria-pressed="true">EN</button><button data-l="zh" aria-pressed="false">中文</button></div>
  <div class="seg" id="tod"><button data-t="asa">朝</button><button data-t="hiru">昼</button><button data-t="yoru">夜</button></div>
</div>
<div class="help"><span class="keys"><span class="free">Click to look around · </span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run · <span class="lockedtip">click a sign to read it · <kbd>E</kbd> sit / use · <kbd>Esc</kbd> frees the mouse</span></span><span class="touch">drag to look · tap a sign to read it</span></div>
<div id="dot" aria-hidden="true"></div>
<button id="seat" type="button"></button>
<div id="toast" aria-live="polite"></div>
<div id="vend" role="dialog" aria-label="Vending machine">
  <div class="vh"><div><div id="vendJp"></div><p class="sub" id="vendSub"></p></div><button class="vx" id="vendClose">やめる ✕</button></div>
  <div class="vg" id="vendGrid"></div>
</div>
<div class="move"><button id="fwd" aria-label="Walk forward">▲</button><button id="back" aria-label="Walk back">▼</button></div>

<div id="card" role="dialog" aria-label="Sign">
  <div class="stripe"></div>
  <div class="body">
    <div id="cardJp"></div>
    <p class="ro" id="cardRo"></p>
    <p class="tr" id="cardTr"></p>
    <div class="row"><button class="save" id="saveBtn">手帳に保存 Save</button><button class="close" id="closeBtn">OK</button></div>
    <div id="saved"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
